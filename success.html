<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام موفق</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazir&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Vazir', sans-serif; }
        body { text-align: center; margin: 0; padding: 0; background-color: #f0f0f0; color: #333; }
        .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); width: 100%; max-width: 500px; margin: 50px auto; text-align: center; }
        h1 { font-size: 2rem; color: #28a745; margin-bottom: 20px; }
        p { font-size: 16px; color: #333; }
        button { padding: 12px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.3s ease-in-out; margin: 10px 5px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ثبت‌نام با موفقیت انجام شد!</h1>
        <p>شما با موفقیت در لیگ بازی فکری ثبت‌نام کردید.</p>
        <button onclick="window.location.href='index.html'">بازگشت به صفحه اصلی</button>
    </div>
</body>
</html>
